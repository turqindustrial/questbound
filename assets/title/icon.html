<!doctype html>
<!-- The app icon: the Questbound emblem (questbound-emblem.webp, the host's own painting prepared by make-emblem.cjs) on
     the game's dark launch glow. make-icons.cjs photographs this page at each size; it needs no internet.
     Query: inset (share of the width left clear on each side), layer (full, bg, fg, mono), simple (1 for small sizes:
     cut close to the serpent ring so the Q stays readable, the star points running off the edge), px (draw at exactly
     this many pixels in the top left corner instead of filling the window). -->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;overflow:hidden;background:transparent}
body{position:relative;overflow:hidden;width:var(--w,100vw);height:var(--w,100vw)}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 48%,rgba(150,92,255,.28) 0,rgba(96,40,150,.14) 30%,rgba(8,6,10,0) 58%),
 radial-gradient(circle at 50% 50%,rgba(120,14,34,.3) 0,rgba(8,6,10,0) 66%),
 #08060a}
.emblem{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);transform:translate(-50%,-50%);background:url(questbound-emblem.webp) center/contain no-repeat}
body.simple .emblem{filter:saturate(1.15) contrast(1.12) brightness(1.08)}
body.bg .emblem{display:none}
body.fg .bg,body.mono .bg{display:none}
body.mono .emblem{filter:brightness(0) invert(1)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="emblem"></div>
<script>
const query=new URLSearchParams(location.search),inset=Number(query.get('inset')??.09),simple=!!query.get('simple');
const px=Number(query.get('px'))||0;if(px)document.body.style.setProperty('--w',px+'px');
// The serpent's outer edge is 82.5% of the emblem's square: a small icon scales the square up so the ring fills it.
const share=(1-2*inset)/(simple?.85:1);
document.body.style.setProperty('--d',px?share*px+'px':share*100+'vw');
document.body.classList.add(query.get('layer')??'full');
if(simple)document.body.classList.add('simple');
</script>
</body>
</html>
