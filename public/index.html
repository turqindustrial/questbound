<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A fantasy tabletop adventure with an AI Dungeon Master, for phone and computer." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- react-native-web's root reset, plus a dark loading card so a phone never sees a white page while the game downloads.
         Expo fills in the language and title placeholders and adds the game script; LaunchScreen.js removes #qb-boot. -->
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #06080c; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; position: relative; z-index: 1; }
      #qb-boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 0;
        background: radial-gradient(ellipse at 50% 38%, rgba(236,170,84,.14), transparent 55%), #06080c; }
      #qb-boot .ring { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; border: 2px solid #d9ae5f; display: grid; place-items: center;
        color: #e8c77b; font: 900 46px/1 Georgia, 'Times New Roman', serif; box-shadow: 0 0 36px rgba(236,170,84,.35); animation: qb-breathe 2.4s ease-in-out infinite; }
      #qb-boot .words { margin-top: 18px; color: #8d96a8; font: 600 11px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
      @keyframes qb-breathe { 0%, 100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #qb-boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Questbound needs JavaScript to run.</noscript>
    <div id="qb-boot" aria-hidden="true"><div><div class="ring">Q</div><div class="words">Questbound &middot; loading</div></div></div>
    <div id="root"></div>
  </body>
</html>
