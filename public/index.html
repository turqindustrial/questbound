<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A fantasy tabletop adventure with an AI Dungeon Master, for phone and computer." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The typefaces start downloading with the page, not after the game script, so titles never flash in a fallback face. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@400;500;600;700;800&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" />
    <link id="qb-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@400;500;600;700;800&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <!-- react-native-web's root reset, plus a dark loading card so a phone never sees a white page while the game downloads.
         Expo fills in the language and title placeholders and adds the game script; LaunchScreen.js removes #qb-boot. -->
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #08060a; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; position: relative; z-index: 1; }
      #qb-boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 0;
        background: radial-gradient(ellipse 60% 45% at 50% 42%, rgba(200,40,70,.18), transparent 70%), radial-gradient(ellipse 120% 80% at 50% 110%, rgba(110,60,200,.16), transparent 70%), #08060a; }
      #qb-boot .seal { position: relative; width: 132px; height: 132px; margin: 0 auto; display: grid; place-items: center; }
      #qb-boot .bezel { position: absolute; inset: 0; border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(196,52,78,.8) 0deg 1.2deg, transparent 1.2deg 7.5deg);
        -webkit-mask: radial-gradient(circle, transparent 60px, #000 61px, #000 65px, transparent 66px); mask: radial-gradient(circle, transparent 60px, #000 61px, #000 65px, transparent 66px);
        animation: qb-turn 24s linear infinite; }
      #qb-boot .ring { width: 96px; height: 96px; border-radius: 50%; border: 2px solid #b2223a; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 40%, rgba(48,26,78,.6), rgba(14,10,14,.95) 70%);
        color: #e04a5c; font: 900 50px/1 'Cinzel Decorative', Georgia, 'Times New Roman', serif; box-shadow: 0 0 40px rgba(230,48,82,.38), inset 0 0 26px rgba(140,82,255,.2);
        animation: qb-breathe 2.6s ease-in-out infinite; }
      #qb-boot .words { margin-top: 22px; text-align: center; font: 700 22px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 7px; text-transform: uppercase;
        background: linear-gradient(180deg, #ffe1e5, #ff5a72 40%, #a3162c 65%, #e23a55); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #qb-boot .bar { width: 160px; height: 2px; margin: 16px auto 0; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #qb-boot .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #b08cf5, transparent); animation: qb-slide 1.4s ease-in-out infinite; }
      #qb-boot .hint { margin-top: 12px; color: #8a7f8a; font: 600 10px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 3px; text-transform: uppercase; text-align: center; }
      @keyframes qb-breathe { 0%, 100% { opacity: .7; transform: scale(.98); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes qb-turn { to { transform: rotate(360deg); } }
      @keyframes qb-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #qb-boot .ring, #qb-boot .bezel, #qb-boot .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Questbound needs JavaScript to run.</noscript>
    <div id="qb-boot" aria-hidden="true"><div><div class="seal"><div class="bezel"></div><div class="ring">Q</div></div><div class="words">Questbound</div><div class="bar"><i></i></div><div class="hint">Opening the tome</div></div></div>
    <div id="root"></div>
  </body>
</html>
