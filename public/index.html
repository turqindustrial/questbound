<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The whole screen is the game's: the browser's bars take its background (theme.js follows the player's theme),
         and from the Home Screen it opens with no browser at all (manifest.json on Android; these tags on iPhone, where
         the status bar sits over the game and webLayout.js keeps the controls clear of it, the notch and the home bar). -->
    <meta name="theme-color" content="#08060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Questbound" />
    <meta name="format-detection" content="telephone=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A fantasy tabletop adventure with an AI Dungeon Master, for phone and computer." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=4" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4" />
    <!-- The typefaces are served from this host (public/fonts, written by fetch-fonts.cjs; SIL Open Font License), never from
         Google, so no third party sees the player load the game. The title faces and the interface face start downloading
         with the page; each face is one file covering all its weights (fonts-v2.css). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cinzel-decorative-900-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cinzel-400-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-400-latin.woff2" />
    <link id="qb-fonts" rel="stylesheet" href="/fonts/fonts-v2.css" />
    <!-- react-native-web's root reset, plus a dark loading card so a phone never sees a white page while the game downloads.
         Expo fills in the language and title placeholders and adds the game script; LaunchScreen.js removes #qb-boot.
         The card's colours are written as the Red theme inside var(--bN, ...); the script after this style block sets
         the variables when the player has chosen another theme (Settings, Theme). -->
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: var(--b0, #08060a); }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; position: relative; z-index: 1; }
      #qb-boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 0;
        background: radial-gradient(ellipse 60% 45% at 50% 42%, var(--b1, rgba(200,40,70,.18)), transparent 70%), radial-gradient(ellipse 120% 80% at 50% 110%, var(--b2, rgba(110,60,200,.16)), transparent 70%), var(--b0, #08060a); }
      /* The emblem (public/emblem/seal-ring-v1.webp and seal-core-v1.webp, made by make-emblem.cjs from the host's
         painting), breathing, its serpent ring turning all the way round once every 36 s under the still Q and blade, as
         in the game (TitleEmblem.js emblemTurn; the game's emblems join this turn where the page's clock has it). The
         script after this style block tints it for the player's theme (--bf) as the game does. In Light it keeps a dark disc. */
      #qb-boot .seal { position: relative; width: 150px; height: 150px; margin: 0 auto; }
      #qb-boot .emblem { position: absolute; inset: 0; filter: var(--bf, none);
        animation: qb-breathe 2.6s ease-in-out infinite; }
      #qb-boot .emblem i { position: absolute; inset: 0; background: center/contain no-repeat; }
      #qb-boot .emblem .ring { background-image: url(/emblem/seal-ring-v1.webp); animation: qb-turn 36s linear infinite; }
      #qb-boot .emblem .core { background-image: url(/emblem/seal-core-v1.webp); }
      html[data-appearance=light] #qb-boot .seal::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle closest-side, rgb(20,1,15) 0, rgb(20,1,15) 86%, rgba(20,1,15,0) 100%); }
      #qb-boot .words { margin-top: 22px; text-align: center; font: 700 22px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 7px; text-transform: uppercase;
        background: linear-gradient(180deg, var(--b3, #ffe1e5), var(--b4, #ff5a72) 40%, var(--b5, #a3162c) 65%, var(--b6, #e23a55)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #qb-boot .bar { width: 160px; height: 2px; margin: 16px auto 0; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #qb-boot .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--b7, #b08cf5), transparent); animation: qb-slide 1.4s ease-in-out infinite; }
      #qb-boot .hint { margin-top: 12px; color: var(--b8, #8a7f8a); font: 600 10px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 3px; text-transform: uppercase; text-align: center; }
      @keyframes qb-breathe { 0%, 100% { opacity: .7; transform: scale(.98); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes qb-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes qb-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #qb-boot .emblem, #qb-boot .emblem .ring, #qb-boot .bar i { animation: none; } }
    </style>
    <!-- qb-theme-colours:start (written by `node verify-theme.cjs --write` from themeRules.js; do not edit by hand) -->
    <script>(function(){try{var p=JSON.parse(localStorage.getItem('questbound.theme.v1')||'{}'),t=p.theme||'red',m=p.mode==='light'?'light':'dark',c={"red:dark":["#08060a","rgba(200,40,70,.18)","rgba(110,60,200,.16)","#ffe1e5","#ff5a72","#a3162c","#e23a55","#b08cf5","#8a7f8a"],"red:light":["#f7f3fb","rgba(255,209,210,.18)","rgba(223,216,255,.16)","#362628","#99002f","#ffd1d0","#a20330","#5c3596","#544a54"],"orange:dark":["#0a0604","rgba(188,92,0,.18)","rgba(131,98,0,.16)","#fff9f5","#ff9b5b","#8a4400","#e47100","#dbc07d","#8e8077"],"orange:light":["#fbf3ee","rgba(137,65,0,.18)","rgba(239,220,181,.16)","#292422","#773600","#fcd5bc","#813c00","#5b4500","#584b43"],"gold:dark":["#05070d","rgba(164,129,24,.18)","rgba(151,82,0,.16)","#fff9ef","#f9d271","#705800","#cba640","#e7b07f","#7a8397"],"gold:light":["#f0f5ff","rgba(107,82,0,.18)","rgba(250,214,186,.16)","#29251e","#574100","#ecddb5","#614a00","#6c3d04","#484e5c"],"green:dark":["#040806","rgba(0,151,78,.18)","rgba(127,100,0,.16)","#f0fff1","#61de8a","#006d3b","#2ab867","#d6c284","#778880"],"green:light":["#eff7f3","rgba(0,106,52,.18)","rgba(236,221,181,.16)","#1e291f","#005929","#c3e9ce","#006230","#594700","#43524b"],"blue:dark":["#04070d","rgba(29,120,209,.18)","rgba(114,65,187,.16)","#f6fbff","#6cb3ff","#1058a6","#3591f1","#b18eec","#798497"],"blue:light":["#eff6ff","rgba(0,89,165,.18)","rgba(226,215,255,.16)","#222629","#004e8e","#c9e0ff","#00539c","#5c388e","#464e5c"],"purple:dark":["#07060b","rgba(137,84,207,.18)","rgba(171,46,87,.16)","#faf9ff","#bb92ff","#6d3aa3","#a26aee","#f18ea1","#85808f"],"purple:light":["#f5f4fd","rgba(108,53,172,.18)","rgba(255,208,217,.16)","#262529","#5d3095","#e5d6fd","#672fa6","#802940","#504b59"]}[t+':'+m],f={"orange":"hue-rotate(62deg) saturate(0.95) brightness(1.25)","gold":"grayscale(1) sepia(1) saturate(2.4) hue-rotate(-2deg) brightness(1.4) contrast(1.25)","green":"hue-rotate(181deg) saturate(1.22) brightness(1.25)","blue":"hue-rotate(223deg) saturate(1.33) brightness(1.17)","purple":"hue-rotate(294deg) saturate(0.8) brightness(1.25)"}[t],s=document.documentElement.style;document.documentElement.setAttribute('data-appearance',m);if(c){for(var i=0;i<c.length;i++)s.setProperty('--b'+i,c[i]);}if(f)s.setProperty('--bf',f);}catch(e){}})();</script>
    <!-- qb-theme-colours:end -->
  </head>
  <body>
    <noscript>Questbound needs JavaScript to run.</noscript>
    <div id="qb-boot" aria-hidden="true"><div><div class="seal"><div class="emblem"><i class="ring"></i><i class="core"></i></div></div><div class="words">Questbound</div><div class="bar"><i></i></div><div class="hint">Opening the tome</div></div></div>
    <div id="root"></div>
  </body>
</html>
