services:
  questbound:
    build: .
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    volumes: ["questbound-data:/data"]
    environment:
      QUESTBOUND_DATA: /data
      QUESTBOUND_PUBLIC_ORIGIN: ${QUESTBOUND_PUBLIC_ORIGIN:?Set the HTTPS game origin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Supply the host secret privately}
      QUESTBOUND_MAIL_SENDER: ${QUESTBOUND_MAIL_SENDER:?Set the dedicated Gmail address}
      QUESTBOUND_MAIL_PASSWORD: ${QUESTBOUND_MAIL_PASSWORD:?Supply the Gmail app password privately}
volumes:
  questbound-data:
